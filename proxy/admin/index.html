<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conol Proxy 管理</title>
  <style>
    body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;margin:24px}
    label{display:block;margin-top:12px}
    input{width:100%;padding:8px;margin-top:4px}
    button{margin-top:12px;padding:8px 12px}
    .box{max-width:720px}
    pre{background:#f6f8fa;padding:12px;border-radius:6px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Conol Proxy 管理</h1>
    <section>
      <h2>添加 Token</h2>
      <label>session_token<input id="token" placeholder="session token"></label>
      <label>passkey<input id="passkey" placeholder="passkey (可选)"></label>
      <label>email<input id="email" placeholder="email (可选)"></label>
      <button id="save">保存到 tokens.txt 并加入池</button>
      <div id="saveResult" style="margin-top:8px"></div>
    </section>

    <section>
      <h2>支持的模型</h2>
      <button id="refreshModels">刷新模型列表</button>
      <pre id="models">(未加载)</pre>
    </section>

    <section>
      <h2>余额 / 额度</h2>
      <button id="refreshBalance">刷新余额</button>
      <pre id="balance">(未加载)</pre>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
